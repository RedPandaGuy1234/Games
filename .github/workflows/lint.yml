name: CodeQL

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 0 * * 0'

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ 'javascript' ]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Check for package.json
      id: pkg
      run: |
        if [ -f package.json ]; then
          echo "has_package=true" >> $GITHUB_OUTPUT
        else
          echo "has_package=false" >> $GITHUB_OUTPUT
        fi

    - name: Initialize CodeQL
      if: steps.pkg.outputs.has_package == 'true'
      uses: github/codeql-action/init@v4.37.7
      with:
        languages: ${{ matrix.language }}

    - name: Autobuild
      if: steps.pkg.outputs.has_package == 'true'
      uses: github/codeql-action/autobuild@v4.37.7

    - name: Perform CodeQL Analysis
      if: steps.pkg.outputs.has_package == 'true'
      uses: github/codeql-action/analyze@v4.37.7
      with:
        # Optional: you can omit category or set a static string
        category: "/language:${{ matrix.language }}"
