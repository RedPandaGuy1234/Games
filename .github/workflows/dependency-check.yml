name: Dependency Check

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 0 * * 0'

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '18'

    - name: Check for package.json
      id: pkg
      run: |
        if [ -f package.json ]; then
          echo "has_package=true" >> $GITHUB_OUTPUT
        else
          echo "has_package=false" >> $GITHUB_OUTPUT
        fi

    - name: Check dependencies
      if: steps.pkg.outputs.has_package == 'true'
      run: |
        npm install
        npm audit --if-present

    - name: Skip dependency check (no package.json)
      if: steps.pkg.outputs.has_package == 'false'
      run: echo "No package.json found — skipping dependency check"
